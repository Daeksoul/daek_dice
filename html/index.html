<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dice Roll Sound</title>
</head>
<body>
	<audio id="diceAudio" preload="auto">
		<source src="diceroll.wav" type="audio/wav">
		Your browser does not support the audio element.
	</audio>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data.type === "playDiceRollSound") {
                const audio = document.getElementById("diceAudio");
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch((err) => {
                        console.error("Audio play failed:", err);
                    });
                }
            }
        });
    </script>
</body>
</html>
